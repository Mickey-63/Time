<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pointage GIOT OptimalGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Mise en page : bandeau de statut plein cadre en haut, dossiers au centre, commandes à portée du pouce en bas. */
  --paper: #eceff3; --card: #ffffff; --ink: #121a23; --mute: #5a6777; --line: #d3dae3;
  --accent: #121a23; --on-accent: #ffffff; --alert: #b3261e; --alert-bg: #fbe9e7;
  --vert: #17884a; --bleu: #1f5fd0; --orange: #e98a06; --gris: #6c7886;
  --on-vert: #ffffff; --on-bleu: #ffffff; --on-orange: #231400; --on-gris: #ffffff;
  --f-display: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --card: #19212a; --ink: #edf1f5; --mute: #9aa7b6; --line: #2d3844;
    --accent: #edf1f5; --on-accent: #0f141a; --alert: #ff8a80; --alert-bg: #3a1c1a;
    --vert: #1f9a56; --bleu: #3577ea; --orange: #f09a1a; --gris: #5d6976;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --card: #19212a; --ink: #edf1f5; --mute: #9aa7b6; --line: #2d3844;
  --accent: #edf1f5; --on-accent: #0f141a; --alert: #ff8a80; --alert-bg: #3a1c1a;
  --vert: #1f9a56; --bleu: #3577ea; --orange: #f09a1a; --gris: #5d6976;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.35 var(--f-body); font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; }
svg.ic { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }

.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; background: var(--paper); position: relative; }
.app.wide { max-width: none; }
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 14px; }

/* Bandeau de statut */
.status { --bg: var(--gris); --fg: var(--on-gris); background: var(--bg); color: var(--fg); padding: calc(10px + env(safe-area-inset-top)) 16px 14px; display: flex; flex-direction: column; gap: 2px; }
.st-bureau { --bg: var(--vert); --fg: var(--on-vert); }
.st-mission { --bg: var(--bleu); --fg: var(--on-bleu); }
.st-pause { --bg: var(--orange); --fg: var(--on-orange); }
.st-absent { --bg: var(--gris); --fg: var(--on-gris); }
.st-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; }
.who { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: rgba(0, 0, 0, .16); color: inherit; font-weight: 600; min-height: 32px; }
.sync { display: inline-flex; align-items: center; gap: 6px; opacity: .95; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.sync.wait i { background: transparent; border: 2px solid currentColor; }
.st-label { font: 700 34px/1.05 var(--f-display); letter-spacing: .01em; display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.st-label svg.ic { width: 30px; height: 30px; stroke-width: 2.4; }
.st-sub { font: 600 20px/1.2 var(--f-display); min-height: 24px; }
.st-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; font-weight: 500; margin-top: 4px; }
.st-meta span { display: inline-flex; align-items: center; gap: 5px; }
.st-meta svg.ic { width: 15px; height: 15px; }

.bar { background: var(--card); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; flex-direction: column; gap: 4px; }
.bar .st-top { color: var(--mute); }
.bar .who { background: var(--paper); color: var(--ink); }
.bar h1 { font-size: 26px; }

/* Reprendre : le geste prioritaire */
.resume { background: var(--accent); color: var(--on-accent); border-radius: 16px; padding: 18px 18px; min-height: 96px; display: flex; flex-direction: column; justify-content: center; gap: 2px; width: 100%; }
.resume b { font: 700 30px/1.05 var(--f-display); }
.resume span { font-size: 15px; opacity: .85; }
.note { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--orange); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; }
.note.warn { border-left-color: var(--alert); background: var(--alert-bg); }
.note b { font-weight: 600; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { min-height: 42px; border-radius: 9px; text-align: center; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 7px; color: var(--mute); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.search { width: 100%; min-height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 0 14px; }
.sec { font: 600 13px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dos { position: relative; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; display: flex; }
.dos .hit { width: 100%; min-height: 84px; padding: 11px 12px 10px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; border-radius: 13px; color: inherit; }
.dos[hidden] { display: none; }
.dos .nm { font: 600 17.5px/1.12 var(--f-display); padding-right: 22px; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.dos .ft { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0 8px; font-size: 12.5px; color: var(--mute); font-weight: 500; }
.dos .ft span { white-space: nowrap; }
.dos .tag { font-weight: 700; letter-spacing: .04em; }
.dos.on { background: var(--st); border-color: var(--st); color: var(--on-st); }
.dos.on .ft { color: inherit; }
.dos.wait { border-style: dashed; border-color: var(--ink); }
.fav { position: absolute; top: 4px; right: 4px; width: 34px; height: 34px; display: grid; place-items: center; color: var(--line); border-radius: 50%; }
.fav[aria-pressed="true"] { color: var(--orange); }
.fav[aria-pressed="true"] svg { fill: currentColor; }
.dos.on .fav { color: inherit; opacity: .55; }
.dos.on .fav[aria-pressed="true"] { opacity: 1; }

/* Commandes au pouce */
.cmd { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; padding: 10px 12px; background: var(--card); border-top: 1px solid var(--line); }
.cmd button { min-height: 62px; border-radius: 13px; background: var(--paper); border: 1.5px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 14.5px/1.1 var(--f-display); text-align: center; padding: 4px; }
.cmd button svg.ic { width: 22px; height: 22px; }
.cmd button.main { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-size: 16px; }
.cmd button.wide { grid-column: span 2; }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs button { min-height: 52px; text-align: center; font: 600 13.5px/1 var(--f-body); color: var(--mute); position: relative; border-top: 3px solid transparent; }
.tabs button[aria-current="true"] { color: var(--ink); border-top-color: var(--ink); }
.badge { display: inline-block; min-width: 18px; padding: 2px 5px; border-radius: 9px; background: var(--alert); color: #fff; font-size: 11px; font-weight: 700; margin-left: 4px; vertical-align: 1px; }

/* Cartes, listes */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; display: flex; flex-direction: column; gap: 9px; }
.card h3 { font-size: 20px; line-height: 1.15; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.row.top { align-items: flex-start; }
.row > div:first-child { min-width: 0; }
.row > b, .row > .btns { flex: none; white-space: nowrap; }
.row > .btns { flex-wrap: nowrap; }
.mute { color: var(--mute); font-size: 14px; }
.small { font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; }
.kpi b { display: block; font: 700 22px/1.1 var(--f-display); }
.kpi span { font-size: 12.5px; color: var(--mute); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--paper); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { background: var(--vert); border-color: var(--vert); color: var(--on-vert); }
.chip.info { background: var(--bleu); border-color: var(--bleu); color: var(--on-bleu); }
.chip.todo { background: var(--orange); border-color: var(--orange); color: var(--on-orange); }
.chip.bad { background: var(--alert); border-color: var(--alert); color: #fff; }
.tl { display: flex; flex-direction: column; }
.tl .it { display: grid; grid-template-columns: 6px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.tl .it:last-child { border-bottom: 0; }
.tl .stripe { align-self: stretch; border-radius: 3px; background: var(--gris); }
.tl .stripe.s-bureau { background: var(--vert); } .tl .stripe.s-mission { background: var(--bleu); } .tl .stripe.s-pause { background: var(--orange); }
.tl .t1 { font-weight: 600; } .tl .t2 { font-size: 13.5px; color: var(--mute); }
.btn { min-height: 44px; padding: 0 16px; border-radius: 11px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--mute); }
label.f input, label.f select, label.f textarea, textarea.txt, input.txt { min-height: 44px; border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 9px 11px; width: 100%; font-weight: 400; color: var(--ink); }
textarea.txt, label.f textarea { min-height: 76px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chk { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.chk input { width: 22px; height: 22px; flex: none; }
.datenav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.datenav button { min-height: 44px; text-align: center; font-size: 22px; }
.datenav b { font: 600 18px var(--f-display); }

/* Équipe */
.pers { display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: center; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; }
.dot { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--bg); color: var(--fg); }
.dot svg.ic { width: 24px; height: 24px; }
.pers .n { font: 600 19px/1.15 var(--f-display); }

/* Tableau mural */
.mural { flex: 1; overflow-y: auto; padding: calc(14px + env(safe-area-inset-top)) 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.mural header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.mural h1 { font-size: clamp(26px, 5vw, 48px); }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--bg); color: var(--fg); border-radius: 18px; padding: 16px; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between; }
.tile .p { font: 700 clamp(26px, 4vw, 44px)/1 var(--f-display); overflow-wrap: anywhere; }
.tile .l { font: 600 clamp(14px, 1.6vw, 20px)/1.15 var(--f-display); display: flex; align-items: center; gap: 7px; }

/* Feuille modale et toast */
.veil { position: absolute; inset: 0; background: rgba(8, 12, 18, .5); display: flex; align-items: flex-end; z-index: 20; }
.sheet { background: var(--card); width: 100%; max-height: 88%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { font-size: 24px; }
.prof { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; width: 100%; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 12px; }
.prof[aria-current="true"] { border-color: var(--ink); background: var(--paper); }
.prof b { font: 600 18px var(--f-display); display: block; }
.toast { position: absolute; left: 12px; right: 12px; bottom: calc(132px + env(safe-area-inset-bottom)); z-index: 30; background: var(--accent); color: var(--on-accent); border-radius: 12px; padding: 12px 14px; font-weight: 500; display: flex; justify-content: space-between; gap: 10px; align-items: center; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
.toast button { color: inherit; font-weight: 700; text-decoration: underline; min-height: 32px; }
.err { color: var(--alert); font-weight: 600; font-size: 14px; }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; font-size: 14.5px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { color: var(--mute); font-weight: 600; }
.tbl td.r, .tbl th.r { text-align: right; }
@media (max-width: 350px) { .st-label { font-size: 28px; } .cmd button { font-size: 13px; } }
@media (prefers-reduced-motion: no-preference) { .dos, .cmd button, .resume { transition: transform .08s; } .dos:active, .cmd button:active, .resume:active { transform: scale(.98); } }
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
/* Moteur de pointage — fonctions pures, sans DOM.
   Les événements sont horodatés en instants absolus (ms epoch).
   Les journées et les exports sont calculés dans le fuseau Europe/Zurich. */
(function (G) {
  'use strict';
  var TZ = 'Europe/Zurich';
  var MIN = 60000, H = 3600000, DAY = 86400000;
  var fmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
  });
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function parts(ts) {
    var o = {}, p = fmt.formatToParts(new Date(ts));
    for (var i = 0; i < p.length; i++) if (p[i].type !== 'literal') o[p[i].type] = +p[i].value;
    return o;
  }
  // Heure murale suisse exprimée comme si elle était UTC (sert aux numéros de série Excel).
  function localAsUTC(ts) {
    var p = parts(ts);
    return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) + (ts % 1000 + 1000) % 1000;
  }
  function offset(ts) { return localAsUTC(ts) - ts; }
  function fromLocal(y, m, d, h, mi, s) {
    var guess = Date.UTC(y, m - 1, d, h || 0, mi || 0, s || 0);
    var t = guess - offset(guess);
    return guess - offset(t);
  }
  function dayKey(ts) { var p = parts(ts); return p.year + '-' + pad(p.month) + '-' + pad(p.day); }
  function dayStart(key) { var a = key.split('-'); return fromLocal(+a[0], +a[1], +a[2]); }
  function nextDayStart(ts) { var p = parts(ts); return fromLocal(p.year, p.month, p.day + 1); }
  function addDays(key, n) { var a = key.split('-'); return dayKey(fromLocal(+a[0], +a[1], +a[2] + n, 12)); }
  function weekKey(ts) {
    var k = dayKey(ts), dow = new Date(localAsUTC(ts)).getUTCDay(); // 0 = dimanche
    return addDays(k, -((dow + 6) % 7)); // lundi de la semaine
  }
  function hhmm(ts) { var p = parts(ts); return pad(p.hour) + ':' + pad(p.minute); }
  function atTime(key, hm) { var a = key.split('-'), b = hm.split(':'); return fromLocal(+a[0], +a[1], +a[2], +b[0], +b[1]); }
  function excelSerial(ts) { return localAsUTC(ts) / DAY + 25569; }
  function excelDate(key) { var a = key.split('-'); return Date.UTC(+a[0], +a[1] - 1, +a[2]) / DAY + 25569; }
  // Affichage seulement : le calcul garde les millisecondes.
  function dur(ms) {
    var m = Math.round(ms / MIN), h = Math.floor(m / 60);
    return h + ' h ' + pad(m % 60);
  }
  function frDate(key) {
    var a = key.split('-');
    var d = new Date(Date.UTC(+a[0], +a[1] - 1, +a[2]));
    var j = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'][d.getUTCDay()];
    return j + ' ' + a[2] + '.' + a[1] + '.' + a[0];
  }

  /* ---------- événements → intervalles ---------- */
  function sortEvents(evs) {
    return evs.slice().sort(function (a, b) {
      return a.ts - b.ts || (a.seq || 0) - (b.seq || 0) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    });
  }
  // Un intervalle = de l'événement jusqu'au suivant. « fin » n'ouvre rien.
  function segments(evs, now) {
    var s = sortEvents(evs), out = [];
    for (var i = 0; i < s.length; i++) {
      var e = s[i], n = s[i + 1];
      if (e.t === 'fin') continue;
      var end = n ? n.ts : Math.max(now, e.ts);
      out.push({
        pid: e.pid, evId: e.id, endEvId: n ? n.id : null, start: e.ts, end: end, open: !n,
        t: e.t, d: e.d || null, lieu: e.lieu || null, cat: e.cat || null,
        corr: !!(e.hist && e.hist.length) || !!(n && n.hist && n.hist.length)
      });
    }
    return out;
  }
  // Un passage à minuit est ventilé sur les deux dates locales.
  function splitByDay(seg) {
    var out = [], a = seg.start;
    for (;;) {
      var nd = nextDayStart(a);
      if (seg.end <= nd) { out.push(Object.assign({}, seg, { start: a, end: seg.end, date: dayKey(a) })); break; }
      out.push(Object.assign({}, seg, { start: a, end: nd, date: dayKey(a), open: false }));
      a = nd;
    }
    return out;
  }
  function pieces(evs, now) {
    var out = [];
    segments(evs, now).forEach(function (s) { splitByDay(s).forEach(function (p) { out.push(p); }); });
    return out;
  }
  function statusOf(evs) {
    var s = sortEvents(evs), e = s[s.length - 1];
    if (!e || e.t === 'fin') return { code: 'absent', t: 'absent', since: e ? e.ts : null };
    if (e.t === 'travail') return { code: e.lieu === 'mission' ? 'mission' : 'bureau', t: 'travail', d: e.d, lieu: e.lieu, since: e.ts };
    return { code: 'pause', t: e.t, cat: e.cat || null, since: e.ts };
  }
  var LABEL = { bureau: 'Au bureau', mission: 'En déplacement professionnel', pause: 'En pause', absent: 'Absent' };

  /* ---------- actions du collaborateur ----------
     Renvoie { ev, ctx } ; ev = null si l'action ne change rien (double appui). */
  function act(evs, ctx, a, now, mk) {
    var cur = statusOf(evs), s = sortEvents(evs), last = s[s.length - 1];
    var ts = last ? Math.max(now, last.ts + 1) : now; // jamais d'intervalle négatif
    function ev(o) { return Object.assign({ ts: ts }, o, mk ? mk() : {}); }
    if (a.type === 'dossier') {
      var lieu = a.lieu || (cur.t === 'travail' ? cur.lieu : (ctx && ctx.lieu)) || 'bureau';
      if (cur.t === 'travail' && cur.d === a.d && cur.lieu === lieu) return { ev: null, ctx: ctx };
      return { ev: ev({ t: 'travail', d: a.d, lieu: lieu }), ctx: null };
    }
    if (a.type === 'lieu') {
      if (cur.t !== 'travail' || cur.lieu === a.lieu) return { ev: null, ctx: ctx };

  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };

  /* ---------- données de démonstration (toutes fictives) ---------- */

    { id: 'p3', prenom: 'Nina', nom: 'Favre', socs: ['og', 'gi'], roles: ['collab'], cout: 65, fonction: 'Partagée OptimalGo et GIOT' },

    { id: 'r2', prenom: 'Sophie', nom: 'Berger', socs: [], scope: ['gi'], roles: ['resp'], fonction: 'Responsable limitée à GIOT' },

    D('c', 'Chantier C · Hydrogène', 'og', 'regie', 'OG-2603', 120), D('dd', 'Chantier D · Autoconsommation', 'og', 'forfait', 'OG-2604'),
    D('e', 'Chantier E · Onduleurs', 'og', 'garantie', 'OG-2605'), D('f', 'Chantier F · Bornes de recharge', 'og', 'regie', 'OG-2606', 100),
    D('ogadm', 'Administration OptimalGo', 'og', 'interne', 'OG-ADM'),
    D('bat18', 'Batailles 18', 'gi', 'interne', 'IM-BAT18'), D('lac4', 'Lac 4', 'gi', 'interne', 'IM-LAC04'), D('gare12', 'Gare 12', 'gi', 'interne', 'IM-GAR12'),
    D('verg7', 'Vergers 7', 'gi', 'interne', 'IM-VER07'), D('moul3', 'Moulin 3', 'gi', 'interne', 'IM-MOU03'), D('till22', 'Tilleuls 22', 'gi', 'interne', 'IM-TIL22'),
    D('jura9', 'Jura 9', 'gi', 'interne', 'IM-JUR09'), D('egl5', 'Église 5', 'gi', 'interne', 'IM-EGL05'), D('pres14', 'Prés 14', 'gi', 'interne', 'IM-PRE14'),

  var AFFECT = {

    p3: ['a', 'dd', 'bat18', 'lac4', 'giadm'], p4: ['b', 'c', 'dd', 'f'], p5: ['bat18', 'gare12', 'verg7', 'till22', 'giadm']

  var collabs = PEOPLE.filter(function (p) { return p.roles.indexOf('collab') >= 0; });

  }

  /* ---------- état local ---------- */
  var LS = 'pointage-giot-optimalgo-v1';
  function blank() {
    return { v: 1, profile: 'p1', seq: 0, jours: {}, dirty: {}, ctx: {}, favs: {}, lieu: {}, tab: {}, seeded: false, cfgDirty: false,
      cfg: { archived: {}, affect: {}, regles: { midiMin: 60, midiEx: 30, rappelPause: 20, rappelMidi: 75 }, rev: 0 } };
  }
  var S = (function () {
    try { var r = localStorage.getItem(LS); if (r) { var o = JSON.parse(r); if (o && o.v === 1) return Object.assign(blank(), o); } } catch (e) { }
    return blank();
  })();
  var stored = true;
  function save() { try { localStorage.setItem(LS, JSON.stringify(S)); stored = true; } catch (e) { stored = false; } }
  var cache = {}, chg = {};
  function touch(key) { cache = {}; if (key) { S.dirty[key] = true; chg[key] = (chg[key] || 0) + 1; } }
  function evsOf(pid) {
    if (cache[pid]) return cache[pid];
    var out = [];
    Object.keys(S.jours).forEach(function (k) { var j = S.jours[k]; if (j.pid === pid) (j.events || []).forEach(function (e) { out.push(e); }); });
    return (cache[pid] = out);
  }
  function jour(pid, date) {
    var k = pid + '_' + date;
    return S.jours[k] || (S.jours[k] = { pid: pid, date: date, events: [], rapports: {}, corr: [], maj: 0 });
  }
  function putEvent(ev, demo) {
    var date = E.dayKey(ev.ts), j = jour(ev.pid, date);
    j.events.push(ev); if (demo) j.demo = true; j.maj = Date.now(); touch(ev.pid + '_' + date);
  }
  function findEvent(pid, id) {
    var keys = Object.keys(S.jours);
    for (var i = 0; i < keys.length; i++) { var j = S.jours[keys[i]]; if (j.pid !== pid) continue; for (var n = 0; n < j.events.length; n++) if (j.events[n].id === id) return { ev: j.events[n], key: keys[i] }; }
    return null;
  }
  function rapport(pid, date, d) { var j = S.jours[pid + '_' + date]; return (j && j.rapports && j.rapports[d]) || null; }
  function setRapport(pid, date, d, patch, demo) {
    var j = jour(pid, date); if (!j.rapports) j.rapports = {};
    j.rapports[d] = Object.assign({}, j.rapports[d] || {}, patch, { rev: Date.now() });
    if (demo) j.demo = true; j.maj = Date.now(); touch(pid + '_' + date);
  }
  function affect(pid) { return (S.cfg.affect[pid] || AFFECT[pid] || []).filter(function (d) { return DOSSIERS[d] && !S.cfg.archived[d]; }); }
  function model() { return { people: PEOPLE, dossiers: DOSSIERS, socs: SOCS, evs: evsOf, rapport: rapport }; }

  /* ---------- synchronisation (magasin partagé de l'artefact, si disponible) ---------- */
  var db = null, sync = 'local', flushing = false, online = navigator.onLine !== false;
  function use(n) { try { return window.claude && typeof window.claude.use === 'function' ? Promise.resolve(window.claude.use(n)).catch(function () { return null; }) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); } }
  function byId(list) { var m = {}; (list || []).forEach(function (x) { m[x.id] = x; }); return m; }
  function mergeDoc(a, b) { // union par identifiant, la révision la plus haute l'emporte
    var ahead = false, out = { pid: b.pid || a.pid, date: b.date || a.date, events: [], rapports: {}, corr: [], maj: Math.max(a.maj || 0, b.maj || 0) };
    if (a.demo || b.demo) out.demo = true;
    ['events', 'corr'].forEach(function (f) {
      var ma = byId(a[f]), mb = byId(b[f]);
      Object.keys(Object.assign({}, ma, mb)).forEach(function (id) {
        var x = ma[id], y = mb[id];
        if (x && (!y || (x.rev || 0) > (y.rev || 0))) { out[f].push(x); ahead = true; } else out[f].push(y);
      });
    });
    var ra = a.rapports || {}, rb = b.rapports || {};
    Object.keys(Object.assign({}, ra, rb)).forEach(function (d) {
      var x = ra[d], y = rb[d];
      if (x && (!y || (x.rev || 0) > (y.rev || 0))) { out.rapports[d] = x; ahead = true; } else out.rapports[d] = y;
    });
    return { doc: out, ahead: ahead };
  }
  function initSync() {
    use('db').then(function (d) {
      if (!d) { seedIfNeeded(false); return; }
      db = d; sync = 'ok';
      var first = true, timer = setTimeout(function () { if (first) { first = false; seedIfNeeded(false); } }, 4000);
      try {
        db.collection('jours').where('date', '>=', E.addDays(E.dayKey(Date.now()), -45)).onSnapshot(function (snap) {
          clearTimeout(timer);
          try {
            snap.docChanges().forEach(function (c) { if (c.type === 'removed' && !S.dirty[c.doc.id]) delete S.jours[c.doc.id]; });
            snap.docs.forEach(function (doc) {
              var data = clone(doc.data() || {}), loc = S.jours[doc.id];
              if (!data.pid) return;
              if (!loc) { S.jours[doc.id] = Object.assign({ events: [], rapports: {}, corr: [] }, data); return; }
              var m = mergeDoc(loc, data); S.jours[doc.id] = m.doc;
              if (m.ahead) S.dirty[doc.id] = true; else if (!chg[doc.id + ':w']) delete S.dirty[doc.id];
            });
          } catch (e) { }
          cache = {}; save();
          if (first) { first = false; seedIfNeeded(!snap.empty); }
          flush(); render();
        }, function () { db = null; sync = 'local'; render(); });
        db.doc('config/main').onSnapshot(function (snap) {
          if (!snap.exists) return;
          var c = clone(snap.data());
          if ((c.rev || 0) > (S.cfg.rev || 0)) { S.cfg = Object.assign(blank().cfg, c); S.cfgDirty = false; save(); render(); }
        }, function () { });
      } catch (e) { db = null; sync = 'local'; seedIfNeeded(false); }
    });
  }
  function flush() {
    if (!db || flushing || sync === 'lecture') return;
    var keys = Object.keys(S.dirty);
    if (!keys.length && !S.cfgDirty) return;
    flushing = true;
    (function next(i) {
      if (i >= keys.length) {
        var done = function () { flushing = false; save(); paintSync(); };
        if (S.cfgDirty) return db.doc('config/main').set(clone(S.cfg)).then(function () { S.cfgDirty = false; done(); }, done);
        return done();
      }
      var k = keys[i], j = S.jours[k], mark = chg[k] || 0;
      if (!j) { delete S.dirty[k]; return next(i + 1); }
      chg[k + ':w'] = true;
      db.doc('jours/' + k).set(clone(j)).then(function () {
        delete chg[k + ':w'];
        if ((chg[k] || 0) === mark) delete S.dirty[k];
        next(i + 1);
      }, function (err) {
        delete chg[k + ':w']; flushing = false;
        if (err && err.code === 'invalid_argument') sync = 'lecture'; // accès en lecture seule : rien n'est écrit
        paintSync();
      });
    })(0);
  }
  function pendingCount() { return Object.keys(S.dirty).length + (S.cfgDirty ? 1 : 0); }
  function syncLabel() {
    var n = pendingCount();
    if (!stored) return ['wait', 'Stockage local refusé'];
    if (!db) return ['', 'Enregistré sur cet appareil'];
    if (sync === 'lecture') return ['wait', 'Lecture seule'];
    if (!online) return ['wait', 'Hors ligne · ' + n + ' à transmettre'];
    return n ? ['wait', n + ' à transmettre'] : ['', 'Synchronisé'];
  }
  function paintSync() { var el = root.querySelector('.sync'); if (el) { var l = syncLabel(); el.className = 'sync ' + l[0]; el.innerHTML = '<i></i>' + esc(l[1]); } }

  /* ---------- jeu de démonstration ---------- */
  function seedIfNeeded(remoteHasData) {
    if (S.seeded) return;
    S.seeded = true;

    save(); render(); flush();
  }
  function seedDemo() {
    var now = Date.now(), today = E.dayKey(now), hier = E.addDays(today, -1), n = 0;
    function play(pid, script) {
      var evs = [], ctx = null;

        ctx = r.ctx; if (r.ev) { evs.push(r.ev); putEvent(r.ev, true); }
      });
      return ctx;
    }
    function h(hm) { return E.atTime(hier, hm); }
    var P = function (c) { return { type: 'pause', cat: c || 'pause' }; }, R = { type: 'reprendre' }, F = { type: 'fin' };
    function W(d, l) { return { type: 'dossier', d: d, lieu: l || 'bureau' }; }
    play('p1', [[h('07:30'), W('a', 'mission')], [h('09:40'), P()], [h('09:52'), R], [h('12:00'), P('midi')], [h('12:45'), R], [h('14:30'), W('e', 'mission')], [h('16:45'), F]]);
    play('p2', [[h('08:00'), W('bat18')], [h('09:30'), W('lac4')], [h('12:00'), P('midi')], [h('12:35'), R], [h('15:00'), W('giadm')], [h('17:15'), F]]);
    play('p3', [[h('08:15'), W('a', 'mission')], [h('12:00'), P('midi')], [h('13:00'), W('bat18')], [h('16:30'), F]]);
    play('p4', [[h('07:00'), W('c', 'mission')], [h('12:00'), P('midi')], [h('12:30'), R], [h('17:30'), F]]);
    play('p5', [[h('08:30'), W('giadm')], [h('12:00'), P('midi')], [h('13:00'), R], [h('17:00'), F]]);
    function rap(pid, d, statut, desc, transfert) {
      var it = E.interventions(evsOf(pid), now)[E.rkey(pid, hier, d)];
      var o = { desc: desc, statut: statut };
      if (statut === 'valide') { o.msValide = it ? it.ms : 0; o.version = 1; o.transfert = transfert; o.ref = E.refRapport(pid, hier, DOSSIERS[d]); o.validePar = 'r1'; if (transfert === 'accepte') o.refCompta = 'CPT-' + (10480 + n); }
      setRapport(pid, hier, d, o, true);
    }
    rap('p1', 'a', 'valide', 'Pose des rails et câblage DC de la toiture sud.', 'accepte');
    rap('p2', 'bat18', 'soumis', 'Appel au chauffagiste pour la panne du circulateur, rendez-vous fixé jeudi.');
    rap('p2', 'lac4', 'soumis', 'État des lieux de sortie, appartement 3.');
    rap('p3', 'a', 'valide', 'Remplacé l’onduleur et vérifié la remise en service.', 'transmis');
    rap('p3', 'bat18', 'soumis', 'Relevé des compteurs et saisie.');
    rap('p4', 'c', 'soumis', 'Raccordement de l’électrolyseur et essai d’étanchéité.');
    rap('p5', 'giadm', 'valide', 'Préparation des salaires.', 'accepte');
    var e0 = E.sortEvents(evsOf('p2'))[0];
    jour('p2', hier).corr.push({ id: 'demo-corr-1', pid: 'p2', evId: e0.id, old: e0.ts, neu: h('07:45'), motif: 'Arrivé plus tôt pour ouvrir au chauffagiste.', at: h('17:20'), by: 'p2', statut: 'proposee', rev: 1 });
    // aujourd'hui : trois collègues en activité, par rapport à l'heure d'ouverture
    var M = E.MIN;
    play('p2', [[now - 95 * M, W('bat18')]]);
    S.ctx.p3 = play('p3', [[now - 150 * M, W('a', 'mission')], [now - 9 * M, P()]]);
    play('p4', [[now - 65 * M, W('c', 'mission')]]);
    cache = {};
  }
  function clearDemo() {
    Object.keys(S.jours).forEach(function (k) {
      if (!S.jours[k].demo) return;
      delete S.jours[k]; delete S.dirty[k];
      if (db) { try { db.doc('jours/' + k).delete().catch(function () { }); } catch (e) { } }
    });
    delete S.ctx.p3; cache = {}; save();
  }

  /* ---------- actions ---------- */
  var toastMsg = null, toastTimer = null, sheet = null;
  function toast(text, act, label) {
    toastMsg = { text: text, act: act, label: label };
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastMsg = null; var t = root.querySelector('.toast'); if (t) t.remove(); }, 6000);
  }
  function lieuChoisi(pid, st) {
    if (st.t === 'travail') return st.lieu;
    var c = S.ctx[pid]; if (st.t === 'pause' && c && c.lieu) return c.lieu;
    return S.lieu[pid] || 'bureau';
  }
  function doAct(a) {
    var pid = S.profile, evs = evsOf(pid), before = E.statusOf(evs);
    if (a.type === 'dossier' && affect(pid).indexOf(a.d) < 0) return; // dossier non affecté : refusé
    var r = E.act(evs, S.ctx[pid] || null, a, Date.now(), function () { return { id: uid(), pid: pid, seq: ++S.seq, rev: 0 }; });
    if (!r.ev) return; // double appui : rien de plus
    // 1. l'état est écrit sur l'appareil avant tout le reste
    putEvent(r.ev);
    if (r.ctx) S.ctx[pid] = r.ctx; else delete S.ctx[pid];

    // 2. le rapport est proposé sans jamais retarder le geste
    if (before.t === 'travail' && (r.ev.t === 'fin' || (r.ev.t === 'travail' && r.ev.d !== before.d))) {
      var it = E.interventions(evsOf(pid), Date.now())[E.rkey(pid, E.dayKey(before.since), before.d)];
      var rp = rapport(pid, E.dayKey(before.since), before.d);
      if (it && it.ms >= E.MIN && (!rp || !rp.statut || rp.statut === 'brouillon')) toast('Rapport à compléter · ' + DOSSIERS[before.d].nom + ' · ' + E.dur(it.ms), 'tab:rapports', 'Ouvrir');
    }
    render(true); flush();
  }
  function applyCorr(c, by) {
    var f = findEvent(c.pid, c.evId);
    if (!f) return 'Événement introuvable.';
    var chk = E.canMove(evsOf(c.pid), c.evId, c.neu, Date.now());
    if (!chk.ok) return chk.err;
    f.ev.hist = (f.ev.hist || []).concat([{ old: f.ev.ts, neu: c.neu, at: Date.now(), by: c.by, validePar: by, motif: c.motif || '' }]);
    f.ev.ts = c.neu; f.ev.rev = Date.now(); S.jours[f.key].maj = Date.now(); touch(f.key);
    // un rapport déjà validé dont la durée change part en révision, jamais en doublon
    var its = E.interventions(evsOf(c.pid), Date.now());
    Object.keys(S.jours).forEach(function (k) {
      var j = S.jours[k]; if (j.pid !== c.pid) return;
      Object.keys(j.rapports || {}).forEach(function (d) {
        var r = j.rapports[d], it = its[E.rkey(c.pid, j.date, d)];
        if (r.statut === 'valide' && it && r.msValide !== it.ms) setRapport(c.pid, j.date, d, { msValide: it.ms, version: (r.version || 1) + 1, transfert: 'transmis', refCompta: r.refCompta });
      });
    });
    return null;
  }
  function setCorr(c, patch) {
    var keys = Object.keys(S.jours);
    for (var i = 0; i < keys.length; i++) {
      var j = S.jours[keys[i]];
      for (var n = 0; n < (j.corr || []).length; n++) if (j.corr[n].id === c.id) { j.corr[n] = Object.assign({}, j.corr[n], patch, { rev: Date.now() }); j.maj = Date.now(); touch(keys[i]); return; }
    }
  }
  function allCorr(filter) {
    var out = [];
    Object.keys(S.jours).forEach(function (k) { (S.jours[k].corr || []).forEach(function (c) { if (!filter || filter(c)) out.push(c); }); });
    return out.sort(function (a, b) { return b.at - a.at; });
  }

  /* ---------- petits composants ---------- */
  var IC = {

    tel: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',

    pinoff: '<path d="M12 21s7-6.2 7-11a7 7 0 0 0-11.5-5.3M5.3 8A7.6 7.6 0 0 0 5 10c0 4.8 7 11 7 11M3 3l18 18"/>'
  };

  function tick(base, t0) { return '<span data-tick data-base="' + base + '" data-t0="' + t0 + '">' + E.dur(base + Date.now() - t0) + '</span>'; }

    var l = syncLabel();
    return '<div class="st-top"><button class="who" data-act="profils" aria-label="Changer de profil de démonstration">' + esc(me.prenom + ' ' + me.nom) + ' ▾</button><span class="sync ' + l[0] + '" role="status"><i></i>' + esc(l[1]) + '</span></div>';
  }

  function cfgChanged() { S.cfg.rev = Date.now(); S.cfgDirty = true; }
  function doExport() {
    var me = person(S.profile), now = Date.now();
    if (!has(me, 'resp')) return; // l'écran mural et les collaborateurs n'exportent pas
    var f = exFilters(me, now), wb = E.workbook(model(), Object.assign({}, f, { socs: me.scope, montants: has(me, 'compta') }), now);
    var name = 'Heures_' + f.from + '_au_' + f.to + '.xlsx', blob = new Blob([window.XlsxLite.build(wb.sheets)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    use('downloads').then(function (dl) {
      if (dl) return dl.save({ filename: name, data: blob }).then(function () { toast('Classeur ' + name + ' enregistré.'); }, function (e) { toast(e && e.code === 'declined' ? 'Export annulé.' : 'Export impossible dans cette vue (' + ((e && e.code) || 'erreur') + ').'); });
      try { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Classeur ' + name + ' généré.'); }
      catch (e) { toast('Téléchargement indisponible dans cette vue.'); }
    }).then(function () { render(true); });
  }
  root.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
    var fn = H[el.getAttribute('data-act')]; if (!fn) return;
    var prev = toastMsg, res = fn(el.dataset, el, ev);
    if (prev && toastMsg === prev) { toastMsg = null; var t = root.querySelector('.toast'); if (t) t.remove(); }
    if (res === false) return;
    save(); render(true); flush();
  });
  root.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'q-dos') return filterDos(t.value);
    if (t.hasAttribute('data-rap')) { var k = parseKey(t.getAttribute('data-rap')); setRapport(k.pid, k.date, k.d, { desc: t.value }); save(); } // brouillon enregistré à chaque frappe
  });
  root.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.hasAttribute('data-ex')) { (S.tab.ex || (S.tab.ex = {}))[t.getAttribute('data-ex')] = t.value; save(); render(true); }
    else if (t.hasAttribute('data-rg')) { var v = Math.max(0, Math.min(240, parseInt(t.value, 10) || 0)); S.cfg.regles[t.getAttribute('data-rg')] = v; cfgChanged(); save(); flush(); }
    else if (t.hasAttribute('data-affp') && sheet && sheet.type === 'aff') {
      var pid = t.getAttribute('data-affp'), list = (S.cfg.affect[pid] || AFFECT[pid] || []).slice(), i = list.indexOf(sheet.d);
      if (t.checked && i < 0) list.push(sheet.d); if (!t.checked && i >= 0) list.splice(i, 1);
      S.cfg.affect[pid] = list; cfgChanged(); save(); flush();
    } else if (t.hasAttribute('data-rap')) flush();
  });
  root.addEventListener('focusout', function () { setTimeout(function () { if (pendingRender) render(); }, 50); });
  window.addEventListener('online', function () { online = true; flush(); render(); });
  window.addEventListener('offline', function () { online = false; render(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { render(); flush(); } });

  render();
  initSync();
})();

</script>
